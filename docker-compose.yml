version: '3.8'

services:
  silicon-pulse-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silicon-pulse-web
    ports:
      - "3000:3000"
    volumes:
      # Mount the local image storage directory
      - ./E_drive:/app/E_drive
      # Optional: Mount the environment variables securely
      - ./.env.local:/app/.env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
